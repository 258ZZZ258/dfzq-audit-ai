# per-profile 档案:P-INT(内规)/ P-EXT(外规)/ P-QA(监管问答)/ P-CASE(案例)。
# CP-010 T1 配置缝起,档案承载:
#   sampling_rate           业务域 L2 直落 profile 额外抽 META_REVIEW spot-check 比例(l2_llm._sampled;
#                           P-INT 由 profile 分档恒入闸,sampling 无关)。
#   qc_indicators           S2 启用指标集(名单见 qc/indicators.INDICATOR_REGISTRY);
#                           **缺省(不写)= 回退代码内硬编码默认**——下列四 profile 显式写出的
#                           即改造前硬编码行为快照,对拍测试 test_preseg_profiles_seam 证零变更。
#   qc_threshold_overrides  对 qc_thresholds.yaml 全局阈值的 per-profile 覆盖(副本生效)。
#   case_ref_source         案例引用外规来源:llm(case_l2 抽取,现状)| structured(预切块直装,P-PRESEG)。
P-INT:
  sampling_rate: 1.0
  qc_indicators: [clause_coverage, clause_continuity, hierarchy_legality,
                  page_anchor_complete, table_consistency, text_quality,
                  extraction_sufficiency]
P-EXT:
  sampling_rate: 0.0
  qc_indicators: [clause_coverage, clause_continuity, hierarchy_legality,
                  page_anchor_complete, table_consistency, text_quality,
                  extraction_sufficiency]
P-QA:
  sampling_rate: 0.0
  qc_indicators: [qa_pair_completeness, page_anchor_complete, text_quality]
P-CASE:
  sampling_rate: 0.0
  qc_indicators: [page_anchor_complete, text_quality]
  case_ref_source: llm
